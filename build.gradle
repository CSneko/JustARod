plugins {
    // 26.x 全平台使用官方名称；no-remap 保持 Fabric 依赖的 classTweaker 命名空间一致。
    id 'dev.architectury.loom-no-remap' version '1.17.491' apply false
    id 'architectury-plugin' version '3.5.168'
    id 'com.gradleup.shadow' version '9.2.2' apply false
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    // 所有子项目都是 Architectury/Loom 项目
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    base {
        archivesName = "${rootProject.archives_name}-${project.name}"
    }

    repositories {
        mavenCentral()
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            name = "KosmX"
            url = "https://maven.kosmx.dev/"
        }
        maven {
            name = 'GeckoLib'
            url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroup("software.bernie.geckolib")
                includeGroup("com.geckolib")
            }
        }
        maven { url = uri("https://oss.sonatype.org/content/groups/public/") }
        maven { url 'https://jitpack.io' }
        flatDir {
            dirs 'libs'
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        if (project.name != 'neoforge') {
            // Minecraft 26.x uses official names at runtime. Do not remap dependencies to named.
            implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
        }
        // NeoForge 侧使用 neoforge/build.gradle 声明的 Forgified Fabric API。

        compileOnly("org.projectlombok:lombok:1.18.46")
        annotationProcessor("org.projectlombok:lombok:1.18.46")
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 25
        // JDK 23+ 默认关闭隐式注解处理；Gradle 9 + JDK 25 的 toolchain worker 会过滤
        // `-proc`/`-processor`，且编译在 Gradle 进程内执行时 Lombok 无法修改 javac AST。
        // 因此显式 fork 到当前 Java 25 的真实 javac 进程，Lombok 才会生效。
        it.options.fork = true
        it.options.forkOptions.executable = "${System.getProperty('java.home')}/bin/javac"
        it.options.compilerArgumentProviders.add(new org.gradle.process.CommandLineArgumentProvider() {
            @Override
            List<String> asArguments() {
                return ['-proc:full', '-processor', 'lombok.launch.AnnotationProcessorHider$AnnotationProcessor']
            }
        })
    }

    kotlin {
        jvmToolchain(25)
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_24
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}
