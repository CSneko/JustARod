plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // Fabric API is already added in the root build for non-neoforge subprojects.
    modImplementation "com.geckolib:geckolib-fabric-26.1.2:$rootProject.geckolib_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // toNeko 26.1.2 本地构建产物：仅用于开发运行时；正式发布时作为前置由玩家自行安装
    modLocalRuntime files("$rootProject.rootDir/libs/toneko-fabric-2.0.0.jar")
    // Kotlin 运行时由 Fabric Language Kotlin 提供，不打包进 mod
    modLocalRuntime files("$rootProject.rootDir/libs/fabric-language-kotlin-1.11.0+kotlin.2.0.0.jar")

    // ModMenu（可选，提供配置屏幕入口）
    modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    // Kotlin stdlib 仅用于编译期；运行时由 Fabric Language Kotlin 提供，不打包进 mod
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.kotlin_version"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_version': rootProject.minecraft_version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

fabricApi {
    configureDataGeneration() {
        client = true
        // 数据生成输出到 common，供两个平台共享
        outputDirectory = project(':common').file('src/main/generated')
        addToResources = false
    }
}

