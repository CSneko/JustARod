# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod properties
mod_version=1.4.0
maven_group=org.cneko
archives_name=JustARod
# 26.2 暂无 Forgified Fabric API，neoforge 侧已在 settings.gradle 禁用
enabled_platforms=fabric,neoforge

# Minecraft properties — 26.1.2 requires Java 25
minecraft_version=26.1.2

# Dependencies — aligned to toNeko 26.1.2
fabric_loader_version=0.19.4
fabric_api_version=0.155.2+26.1.2
forgified_fabric_api_version=0.155.2+26.1.2+3.5.5
neoforge_version=26.1.2.99
# GeckoLib — 26.1.2 branch (com.geckolib)
geckolib_version=5.5.2
# ModMenu — 26.1.2
modmenu_version=20.0.0
# toNeko 本地构建版本（尚未发布 Modrinth）
toneko_version=2.0.0
# Kotlin (JustARod 仍有 Kotlin 源码)
kotlin_version=2.2.10

# 本机代理（maven.neoforged.net 直连会被重置，需走本地代理）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=2080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=2080
systemProp.http.nonProxyHosts=localhost|127.0.0.1

# Kotlin 2.2.10 尚未提供 JVM_25 目标，而 Minecraft 26.1.2 需要 Java 25；
# 输出 JVM_24 字节码在 Java 25 上运行没问题，这里关闭目标一致性硬校验。
kotlin.jvm.target.validation.mode=warning
